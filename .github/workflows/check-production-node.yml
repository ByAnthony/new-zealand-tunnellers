name: Update Node and npm versions

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      update-available: ${{ steps.versions.outputs.update-available }}
      configured-node: ${{ steps.versions.outputs.configured-node }}
      configured-npm: ${{ steps.versions.outputs.configured-npm }}
      latest-node: ${{ steps.versions.outputs.latest-node }}
      latest-npm: ${{ steps.versions.outputs.latest-npm }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: versions
        name: Check available Node and npm versions
        env:
          SSH_HOST: ${{ secrets.SERVER }}
          SSH_USER: ${{ secrets.USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_DIR: ${{ secrets.SERVER_DIR }}
        run: |
          configured_node="$(tr -d '\r\n' < .nvmrc)"
          configured_npm="$(node -p "require('./package.json').engines.npm")"
          node_major="${configured_node%%.*}"

          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy.key
          chmod 600 ~/.ssh/deploy.key

          available_nodes="$(ssh -T -i ~/.ssh/deploy.key -p 5022 \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            'for node in nodevenv/'"$SERVER_DIR"'/*/bin/node; do
              [ -x "$node" ] || continue
              "$node" --version
            done')"

          latest_node="$(printf '%s\n' "$available_nodes" |
            sed 's/^v//' |
            awk -F. -v major="$node_major" '$1 == major' |
            sort -V |
            tail -n 1)"

          [ -n "$latest_node" ] || {
            echo "The web host has no Node $node_major version available"
            exit 1
          }

          latest_npm="$(curl --fail --silent --show-error \
            https://registry.npmjs.org/npm/latest |
            node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"

          if [ "$configured_node" = "$latest_node" ] && [ "$configured_npm" = "$latest_npm" ]; then
            update_available=false
          else
            update_available=true
          fi

          printf 'Available Node versions from web host:\n%s\n' "$available_nodes"
          printf 'Configured Node: %s\n' "$configured_node"
          printf 'Latest Node %s available from web host: %s\n' "$node_major" "$latest_node"
          printf 'Configured npm: %s\n' "$configured_npm"
          printf 'Latest npm: %s\n' "$latest_npm"

          {
            echo "update-available=$update_available"
            echo "configured-node=$configured_node"
            echo "configured-npm=$configured_npm"
            echo "latest-node=$latest_node"
            echo "latest-npm=$latest_npm"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Runtime version check"
            echo
            echo "| Runtime | Configured | Latest available |"
            echo "| --- | --- | --- |"
            echo "| Node $node_major (web host) | \`$configured_node\` | \`$latest_node\` |"
            echo "| npm (registry) | \`$configured_npm\` | \`$latest_npm\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  create-update-pr:
    needs: check-versions
    if: needs.check-versions.outputs.update-available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up latest Node version from web host
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ needs.check-versions.outputs.latest-node }}
          cache: npm

      - name: Update Node and npm versions
        env:
          LATEST_NODE: ${{ needs.check-versions.outputs.latest-node }}
          LATEST_NPM: ${{ needs.check-versions.outputs.latest-npm }}
        run: |
          printf '%s\n' "$LATEST_NODE" > .nvmrc
          npm pkg set "engines.node=$LATEST_NODE" "engines.npm=$LATEST_NPM"
          npm install --global "npm@$LATEST_NPM"
          npm install --package-lock-only
          npm ci

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-node-and-npm
          delete-branch: true
          commit-message: "chore: update Node and npm"
          title: "chore: update Node to ${{ needs.check-versions.outputs.latest-node }} and npm to ${{ needs.check-versions.outputs.latest-npm }}"
          body: |
            Updates the supported runtime versions:

            | Runtime | Previous | Updated |
            | --- | --- | --- |
            | Node | `${{ needs.check-versions.outputs.configured-node }}` | `${{ needs.check-versions.outputs.latest-node }}` |
            | npm | `${{ needs.check-versions.outputs.configured-npm }}` | `${{ needs.check-versions.outputs.latest-npm }}` |

            Node availability is sourced from the web host. npm availability is sourced from the npm registry.
