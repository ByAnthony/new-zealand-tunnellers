name: Update Node and npm versions

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      update-available: ${{ steps.versions.outputs.update-available }}
      configured-node: ${{ steps.versions.outputs.configured-node }}
      configured-npm: ${{ steps.versions.outputs.configured-npm }}
      latest-node: ${{ steps.versions.outputs.latest-node }}
      latest-npm: ${{ steps.versions.outputs.latest-npm }}
      major-update-available: ${{ steps.versions.outputs.major-update-available }}
      latest-major-node: ${{ steps.versions.outputs.latest-major-node }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: versions
        name: Check available Node and npm versions
        env:
          SSH_HOST: ${{ secrets.SERVER }}
          SSH_USER: ${{ secrets.USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_DIR: ${{ secrets.SERVER_DIR }}
        run: |
          configured_node="$(tr -d '\r\n' < .nvmrc)"
          configured_npm="$(node -p "require('./package.json').engines.npm")"
          node_major="${configured_node%%.*}"

          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy.key
          chmod 600 ~/.ssh/deploy.key

          available_runtime_pairs="$(ssh -T -i ~/.ssh/deploy.key -p 5022 \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            'for node in nodevenv/'"$SERVER_DIR"'/*/bin/node; do
              [ -x "$node" ] || continue
              bin="${node%/*}"
              npm="$bin/npm"
              [ -x "$npm" ] || continue
              node_version="$("$node" --version)"
              npm_version="$(PATH="$bin:$PATH" "$npm" --version)" || continue
              printf "%s %s\n" "$node_version" "$npm_version"
            done')"

          latest_runtime_pair="$(printf '%s\n' "$available_runtime_pairs" |
            awk -v major="$node_major" '$1 ~ "^v" major "\\."' |
            sort -V -k1,1 |
            tail -n 1)"
          latest_node="${latest_runtime_pair%% *}"
          latest_node="${latest_node#v}"
          latest_npm="${latest_runtime_pair#* }"

          latest_major_node="$(printf '%s\n' "$available_runtime_pairs" |
            sort -V -k1,1 |
            tail -n 1)"
          latest_major_node="${latest_major_node%% *}"
          latest_major_node="${latest_major_node#v}"

          [ -n "$latest_node" ] || {
            echo "The web host has no Node $node_major version available"
            exit 1
          }

          if [ "$configured_node" = "$latest_node" ] && [ "$configured_npm" = "$latest_npm" ]; then
            update_available=false
          else
            update_available=true
          fi

          if [ "${latest_major_node%%.*}" -gt "$node_major" ]; then
            major_update_available=true
          else
            major_update_available=false
          fi

          printf 'Available Node/npm versions from web host:\n%s\n' "$available_runtime_pairs"
          printf 'Configured Node: %s\n' "$configured_node"
          printf 'Latest Node/npm pair available from web host: %s / %s\n' "$latest_node" "$latest_npm"
          printf 'Latest Node available from web host: %s\n' "$latest_major_node"
          printf 'Configured npm: %s\n' "$configured_npm"

          {
            echo "update-available=$update_available"
            echo "configured-node=$configured_node"
            echo "configured-npm=$configured_npm"
            echo "latest-node=$latest_node"
            echo "latest-npm=$latest_npm"
            echo "major-update-available=$major_update_available"
            echo "latest-major-node=$latest_major_node"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Runtime version check"
            echo
            echo "| Runtime | Configured | Latest available |"
            echo "| --- | --- | --- |"
            echo "| Node $node_major (N0C) | \`$configured_node\` | \`$latest_node\` |"
            echo "| npm (paired with Node) | \`$configured_npm\` | \`$latest_npm\` |"
            if [ "$major_update_available" = true ]; then
              echo
              echo "> [!WARNING]"
              echo "> Node major update available: \`$configured_node\` -> \`$latest_major_node\`. Follow the [major-version update procedure](../docs/runtime-updates.md#node-major-version-updates)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  create-update-pr:
    needs: check-versions
    if: needs.check-versions.outputs.update-available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up latest Node version from web host
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ needs.check-versions.outputs.latest-node }}
          cache: npm

      - name: Update Node and npm versions
        env:
          LATEST_NODE: ${{ needs.check-versions.outputs.latest-node }}
          LATEST_NPM: ${{ needs.check-versions.outputs.latest-npm }}
        run: |
          printf '%s\n' "$LATEST_NODE" > .nvmrc
          npm pkg set "engines.node=$LATEST_NODE" "engines.npm=$LATEST_NPM"
          npm install --global "npm@$LATEST_NPM"
          npm install --package-lock-only
          npm ci

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-node-and-npm
          delete-branch: true
          commit-message: "chore: update Node and npm"
          title: "chore: update Node to ${{ needs.check-versions.outputs.latest-node }} and npm to ${{ needs.check-versions.outputs.latest-npm }}"
          body: |
            Updates the supported runtime versions:

            | Runtime | Previous | Updated |
            | --- | --- | --- |
            | Node | `${{ needs.check-versions.outputs.configured-node }}` | `${{ needs.check-versions.outputs.latest-node }}` |
            | npm | `${{ needs.check-versions.outputs.configured-npm }}` | `${{ needs.check-versions.outputs.latest-npm }}` |

            Node.js and npm versions are sourced as a matched runtime pair from N0C.

  create-major-update-issue:
    needs: check-versions
    if: needs.check-versions.outputs.major-update-available == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LATEST_NODE: ${{ needs.check-versions.outputs.latest-major-node }}
    steps:
      - name: Create issue when one does not already exist
        run: |
          title="chore: upgrade Node to $LATEST_NODE"
          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$title\" in:title" \
            --json number \
            --jq '.[0].number')"

          [ -n "$existing_issue" ] && exit 0

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body "A newer Node major version is available from N0C. Follow the [major-version update procedure](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/runtime-updates.md#node-major-version-updates)."
