name: Check production Node version

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-node-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check available Node and npm versions
        env:
          SSH_HOST: ${{ secrets.SERVER }}
          SSH_USER: ${{ secrets.USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_DIR: ${{ secrets.SERVER_DIR }}
        run: |
          configured_node="$(tr -d '\r\n' < .nvmrc)"
          configured_npm="$(node -p "require('./package.json').engines.npm")"
          node_major="${configured_node%%.*}"

          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy.key
          chmod 600 ~/.ssh/deploy.key

          available_nodes="$(ssh -T -i ~/.ssh/deploy.key -p 5022 \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            'for node in nodevenv/'"$SERVER_DIR"'/*/bin/node; do
              [ -x "$node" ] || continue
              "$node" --version
            done')"

          latest_host_node="$(printf '%s\n' "$available_nodes" |
            sed 's/^v//' |
            awk -F. -v major="$node_major" '$1 == major' |
            sort -V |
            tail -n 1)"

          [ -n "$latest_host_node" ] || {
            echo "The web host has no Node $node_major version available"
            exit 1
          }

          latest_npm="$(curl --fail --silent --show-error \
            https://registry.npmjs.org/npm/latest |
            node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"

          printf 'Available Node versions from web host:\n%s\n' "$available_nodes"
          printf 'Configured Node: %s\n' "$configured_node"
          printf 'Latest Node %s available from web host: %s\n' "$node_major" "$latest_host_node"
          printf 'Configured npm: %s\n' "$configured_npm"
          printf 'Latest npm: %s\n' "$latest_npm"

          outdated=false

          if [ "$configured_node" != "$latest_host_node" ]; then
            echo "Node update available: $configured_node -> $latest_host_node"
            outdated=true
          fi

          if [ "$configured_npm" != "$latest_npm" ]; then
            echo "npm update available: $configured_npm -> $latest_npm"
            outdated=true
          fi

          {
            echo "## Runtime version check"
            echo
            echo "| Runtime | Configured | Latest available |"
            echo "| --- | --- | --- |"
            echo "| Node $node_major (web host) | \`$configured_node\` | \`$latest_host_node\` |"
            echo "| npm (registry) | \`$configured_npm\` | \`$latest_npm\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$outdated" = false ]
